name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: darkspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore DarkSpace.sln

      - name: Build solution
        run: dotnet build DarkSpace.sln -c Release --no-restore --nologo

      - name: Unit tests
        run: >-
          dotnet test tests/UnitTests/UnitTests.csproj
          -c Release --no-build --no-restore --nologo
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Integration tests
        run: >-
          dotnet test tests/IntegrationTests/IntegrationTests.csproj
          -c Release --no-build --no-restore --nologo
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect release assemblies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/assemblies artifacts/metadata
          cp -v src/Core/bin/Release/net8.0/DarkSpace.Core.dll artifacts/assemblies/
          # Godot.NET.Sdk currently places the game assembly in its Debug staging
          # directory even when the outer solution is built as Release. Resolve
          # the actual output instead of assuming a configuration-specific path.
          game_dll="$(find .godot/mono/temp/bin -type f -name 'DarkSpace.dll' -print -quit)"
          test -n "$game_dll"
          cp -v "$(dirname "$game_dll")"/DarkSpace.* artifacts/assemblies/
          git rev-parse HEAD > artifacts/metadata/commit.txt
          dotnet --info > artifacts/metadata/dotnet-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkspace-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  replay-windows:
    name: Replay regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run replay and digest regression tests
        run: >-
          dotnet test tests/UnitTests/UnitTests.csproj -c Release --nologo
          --filter FullyQualifiedName~SimulationReplayTests
          --logger "trx;LogFileName=replay-windows.trx"

      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-windows-${{ github.sha }}
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  godot-headless:
    name: Godot headless smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Godot C# project
        run: dotnet build DarkSpace.csproj -c Debug --nologo

      - name: Download Godot .NET
        shell: bash
        run: |
          set -euo pipefail
          version='4.7.2'
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_mono_linux_x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          godot="$(find "$RUNNER_TEMP/godot/bin" -type f -name "Godot_v${version}-stable_mono_linux.x86_64" -print -quit)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --editor --headless --path . --import --quit 2>&1 | tee godot-import.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-import.log; then
            exit 1
          fi

      - name: Run main scene headless
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --quit-after 120 2>&1 | tee godot-smoke.log
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR|ERROR):' godot-smoke.log; then
            exit 1
          fi

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs-${{ github.sha }}
          path: godot-*.log
          if-no-files-found: ignore
          retention-days: 14
