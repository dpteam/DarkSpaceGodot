name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DarkSpace.sln

      - name: Build (вся solution)
        run: dotnet build DarkSpace.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/UnitTests/UnitTests.csproj -c Release --no-build

      - name: Integration tests
        run: dotnet test tests/IntegrationTests/IntegrationTests.csproj -c Release --no-build
